spring.application.name=collections

# Datasource — must be provided via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.schema_management.create_check_constraints=false

# H2 console
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# Jackson — allow endpoints expecting List<T> to accept a single object { ... } transparently
spring.jackson.deserialization.accept-single-value-as-array=true

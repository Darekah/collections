spring.application.name=collections

# Datasource — provided via OS env vars (canonical) or a local .env file
# (gitignored; see .env.example). Never commit real credentials.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.schema_management.create_check_constraints=false

# Jackson — allow endpoints expecting List<T> to accept a single object { ... } transparently
spring.jackson.deserialization.accept-single-value-as-array=true

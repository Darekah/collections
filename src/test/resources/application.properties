# Tests always use in-memory H2 — never touch the real Neon database
spring.datasource.url=jdbc:h2:mem:testdb
spring.jpa.hibernate.ddl-auto=create-drop

# Avoid H2 2.4.x bug with Hibernate-generated CHECK constraints on closed DDL sessions
spring.jpa.properties.hibernate.schema_management.create_check_constraints=false

# Jackson — allow endpoints expecting List<T> to accept a single object { ... } transparently
spring.jackson.deserialization.accept-single-value-as-array=true